packages: []

allowBuilds:
  esbuild: true
  lefthook: true
  lightningcss: true
  msw: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  # Tooling releases frequently and never ships in the application bundle.
  - "@oxfmt/*"
  - "@oxlint/*"
  - oxfmt
  - oxlint
  # Exact releases reviewed for the stable Start upgrade on 2026-10-13.
  # Keep the age guard active for all other application releases.
  - "@tanstack/react-router@1.170.44"
  - "@tanstack/react-start-client@1.168.42"
  - "@tanstack/react-start-rsc@0.1.62"
  - "@tanstack/react-start-server@1.167.49"
  - "@tanstack/react-start@1.169.1"
  - "@tanstack/router-core@1.171.37"
  - "@tanstack/router-generator@1.167.43"
  - "@tanstack/router-plugin@1.168.45"
  - "@tanstack/start-client-core@1.170.37"
  - "@tanstack/start-plugin-core@1.171.52"
  - "@tanstack/start-server-core@1.169.42"
  - "@tanstack/start-storage-context@1.167.39"
  - lefthook-android-arm64@2.2.2
  - lefthook-darwin-arm64@2.2.2
  - lefthook-darwin-x64@2.2.2
  - lefthook-freebsd-arm64@2.2.2
  - lefthook-freebsd-x64@2.2.2
  - lefthook-linux-arm64@2.2.2
  - lefthook-linux-x64@2.2.2
  - lefthook-openbsd-arm64@2.2.2
  - lefthook-openbsd-x64@2.2.2
  - lefthook-windows-arm64@2.2.2
  - lefthook-windows-x64@2.2.2
  - lefthook@2.2.2
  - oxlint-plugin-react-doctor@0.9.18
