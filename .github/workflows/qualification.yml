name: Qualification

# When a pull request merges, moves each issue its Qualification section
# declares to awaiting-qualification (scripts/apply-qualification.ts).
# pull_request_target runs this file and the script from the default branch with
# a token that can write issues, so nothing here checks out or runs pull request
# code, and the description reaches the script only as a file. It is the
# description in the merge event, which the required pr-description check
# passed; a re-run reuses that event, so an edit after merge never applies.
# scripts/qualification-workflow.test.ts pins this shape and runs the apply step.
on:
  pull_request_target:
    types: [closed]

# One run at a time across every pull request, so two merges never write the
# same issue at once. closed-issue-labels.yml shares the group, so a close never
# reads an issue while a merge is moving it; the name stays the one
# `${{ github.workflow }}` gave, so a re-run of an older run joins it too. `queue: max` keeps up to 100 runs
# waiting in order; the default keeps one and cancels older pending runs. None
# cancels a running one.
concurrency:
  group: Qualification
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  qualification:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default branch, never the pull request's head.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: a cache another run saved could hold packages the lockfile
      # does not pin, and this job holds a token that can write issues.
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: .nvmrc
          cache: false
          install: false

      # The script parses issue bodies with the Markdown parser the lockfile
      # pins. It installs the default branch's lockfile, never a pull request's,
      # and runs no install scripts, so the only package code that runs is what
      # the script imports.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply the Qualification section
        id: apply
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" >"$RUNNER_TEMP/body.md"
          # Text from the description must print as text, not run as a workflow command.
          resume=$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::$resume"
          status=0
          node scripts/apply-qualification.ts "$RUNNER_TEMP/body.md" || status=$?
          echo "::$resume::"
          exit "$status"
