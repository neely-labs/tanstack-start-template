name: Qualification

# When a pull request merges, moves each issue its Qualification section
# declares to awaiting-qualification (scripts/apply-qualification.ts).
# pull_request_target runs this file and the script from the default branch with
# a token that can write issues, so nothing here checks out or runs pull request
# code, and the description reaches the script only as a file.
# scripts/qualification-workflow.test.ts pins this shape and runs the apply step.
on:
  pull_request_target:
    types: [closed]

# Runs for the same pull request queue rather than cancel: a re-run must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  qualification:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default branch, never the pull request's head.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only Node is needed: the script uses no dependencies.
      - name: Set up Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .nvmrc
          cache: false
          install: false

      # Reads the description now, so a re-run applies the current text.
      - name: Apply the Qualification section
        id: apply
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""' >"$RUNNER_TEMP/body.md"
          # Text from the description must print as text, not run as a workflow command.
          resume=$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::$resume"
          status=0
          node scripts/apply-qualification.ts "$RUNNER_TEMP/body.md" || status=$?
          echo "::$resume::"
          exit "$status"
