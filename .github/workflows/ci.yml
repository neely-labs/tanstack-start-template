name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `validate` is a required status check, so this job always has to report a
      # conclusion. Skipping the workflow with `paths-ignore` would leave
      # documentation-only pull requests waiting on a check that never arrives,
      # so narrow the work inside the job instead. scripts/ci-docs-scope.test.ts
      # runs this step's script with a fake `gh`.
      - name: Detect documentation-only changes
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # One line per file: its path, then a rename's old path after a tab.
          # @tsv escapes tabs and newlines inside a name, so a name adds no lines.
          per_file='def per_file: .[] | [.filename, .previous_filename // empty] | @tsv;'
          changed=""
          case "$EVENT" in
            pull_request)
              # The files endpoint stops at 3,000 files, so a list shorter than
              # the pull request's file count is partial.
              changed=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
                --jq "$per_file"' per_file') || changed=""
              lines=$(printf '%s\n' "$changed" | wc -l)
              [ "$((lines))" = "$PR_FILES" ] || changed=""
              ;;
            push)
              # A compare lists at most 300 files, so a list of 300 may be partial.
              # A branch's first push reports an all-zero "before" that cannot be compared.
              if [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
                changed=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" \
                  --jq "$per_file"' if (.files | type) == "array" and (.files | length) < 300 then .files | per_file else empty end') ||
                  changed=""
              fi
              ;;
          esac

          # An empty list means "could not determine", never "nothing changed",
          # so fall through to the full run. Only Markdown at the root or under
          # docs/ qualifies; other files there can be imported or served.
          docs_only=false
          if [ -n "$changed" ]; then
            docs_only=true
            while IFS= read -r file; do
              [[ $file =~ ^(docs/.+|[^/]+)\.md$ ]] || docs_only=false
            done <<<"${changed//$'\t'/$'\n'}"
          fi
          echo "docs-only=$docs_only" >>"$GITHUB_OUTPUT"
          printf 'docs-only=%s for these changed paths:\n%s\n' "$docs_only" "$changed"

      # Reuses the runner's preinstalled Node instead of letting pnpm fetch a
      # 57 MB tarball on every run, which it did before the store cache restored
      # and so could never be served from it.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Formatting and linting cover Markdown too, so documentation still gets
      # checked; only the type, test, and build gates are skipped. These are the
      # first two stages of `pnpm validate`, so the two paths cannot drift apart.
      # The doc budget is a script, not a test, because this path skips tests.
      - name: Check documentation
        if: steps.scope.outputs.docs-only == 'true'
        run: pnpm check && pnpm docs:budget

      - name: Validate
        if: steps.scope.outputs.docs-only != 'true'
        run: pnpm validate

      - name: Install browser for smoke tests
        if: steps.scope.outputs.docs-only != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test production app
        id: browser
        if: steps.scope.outputs.docs-only != 'true'
        run: pnpm test:e2e

      - name: Retain browser failure evidence
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
